appId: org.reactjs.native.example.KiselNativeProbe
---
- assertVisible: "Open native Cocos"
- tapOn:
    id: open-cocos
- assertVisible: "Return to RN"
- evalScript: ${output.cycle = 0}
- repeat:
    times: 10
    commands:
      - evalScript: ${output.cycle = output.cycle + 1}
      - pressKey: Home
      - assertNotVisible: "Return to RN"
      - takeScreenshot: lifecycle-ios-background-home-${output.cycle}
      - launchApp:
          stopApp: false
          clearState: false
          permissions: {}
      - assertVisible: "Return to RN"
      - tapOn:
          point: "50%,60%"
          retryTapIfNoChange: false
      - takeScreenshot: lifecycle-ios-background-resumed-${output.cycle}
- tapOn:
    id: dismiss-cocos
- assertVisible: "Open native Cocos"
- assertVisible: "RN taps: 10"
- takeScreenshot: lifecycle-ios-background-final-rn
