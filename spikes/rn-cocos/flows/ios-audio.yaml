appId: org.reactjs.native.example.KiselNativeProbe
---
# Start in the already opened Cocos scene. Native logs are the audio oracle.
- assertVisible: "Return to RN"
- tapOn:
    point: "75%,81%"
    retryTapIfNoChange: false
- tapOn:
    point: "25%,81%"
    retryTapIfNoChange: false
- tapOn:
    point: "75%,81%"
    retryTapIfNoChange: false
- takeScreenshot: audio-ios-muted
- pressKey: Home
- assertNotVisible: "Return to RN"
- launchApp:
    stopApp: false
    clearState: false
    permissions: {}
- assertVisible: "Return to RN"
- takeScreenshot: audio-ios-resumed-muted
- tapOn:
    point: "25%,81%"
    retryTapIfNoChange: false
- tapOn:
    point: "75%,81%"
    retryTapIfNoChange: false
- repeat:
    times: 3
    commands:
      - pressKey: Home
      - assertNotVisible: "Return to RN"
      - launchApp:
          stopApp: false
          clearState: false
          permissions: {}
      - assertVisible: "Return to RN"
- takeScreenshot: audio-ios-resumed-unmuted
- tapOn:
    id: dismiss-cocos
- assertVisible: "Open native Cocos"
- assertVisible: "Bridge PASS: color=1, rejected=9/9"
