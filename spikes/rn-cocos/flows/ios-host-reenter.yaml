appId: org.reactjs.native.example.KiselNativeProbe
---
- assertVisible: "Return to RN"
- takeScreenshot: ios-host-before-touch
- tapOn:
    point: "50%,60%"
    retryTapIfNoChange: false
- takeScreenshot: ios-host-after-touch
- tapOn:
    id: dismiss-cocos
- assertVisible: "Open native Cocos"
- assertVisible: "opened"
- assertVisible: "RN taps: 0"
- tapOn:
    id: rn-tap-button
- assertVisible: "RN taps: 1"
- takeScreenshot: ios-host-rn-return
- tapOn:
    id: open-cocos
- assertVisible: "Return to RN"
- takeScreenshot: ios-host-reopened
- tapOn:
    point: "50%,60%"
    retryTapIfNoChange: false
- takeScreenshot: ios-host-reopened-touch
- tapOn:
    id: dismiss-cocos
- assertVisible: "Open native Cocos"
- assertVisible: "RN taps: 1"
- takeScreenshot: ios-host-rn-return2
