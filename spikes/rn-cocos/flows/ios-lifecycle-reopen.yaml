appId: org.reactjs.native.example.KiselNativeProbe
---
- assertVisible: "Open native Cocos"
- assertVisible: "RN taps: 0"
- evalScript: ${output.cycle = 0}
- repeat:
    times: 10
    commands:
      - evalScript: ${output.cycle = output.cycle + 1}
      - tapOn:
          id: open-cocos
      - assertVisible: "Return to RN"
      - tapOn:
          point: "50%,60%"
          retryTapIfNoChange: false
      - takeScreenshot: lifecycle-ios-reopen-${output.cycle}
      - tapOn:
          id: dismiss-cocos
      - assertVisible: "Open native Cocos"
      - assertVisible: "Bridge PASS: color=1, rejected=9/9"
      - tapOn:
          id: rn-tap-button
      - assertVisible: "RN taps: ${output.cycle}"
- takeScreenshot: lifecycle-ios-reopen-final-rn
