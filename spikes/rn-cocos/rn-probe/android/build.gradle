buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// A host-owned focus request must not compete with CocosActivity's default owner.
// Adapt a hash-checked build copy; never edit the installed Cocos toolchain.
project(':cocos-runtime') {
    afterEvaluate {
        def adapter = new File(rootDir, '../../prepare_android_audio.py')
        def vendorJava = new File(projectDir, '../java/src')
        def adaptedJava = new File(rootProject.buildDir, 'kisel-cocos-java')
        def prepareHostAudioJava = tasks.register('prepareHostAudioJava', Exec) {
            inputs.file(adapter)
            inputs.dir(vendorJava)
            outputs.dir(adaptedJava)
            commandLine 'python3', adapter.absolutePath
        }
        android.sourceSets.main.java.setSrcDirs([adaptedJava])
        tasks.named('preBuild').configure { dependsOn(prepareHostAudioJava) }
    }
}
